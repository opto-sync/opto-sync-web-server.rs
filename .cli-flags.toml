[help]
url = "https://github.com/opto-sync/opto-sync-web-server.rs"

[parse]
allow_unknown = false

[flags.bind]
env = "OPTO_SYNC_WEB_BIND"
aliases = ["bind"]
type = "string"
default = "127.0.0.1:8081"
help = "HTTP bind address."

[flags.api-http-base]
env = "OPTO_SYNC_API_HTTP_BASE"
aliases = ["api-http-base"]
type = "string"
help = "API HTTP base URL."

[flags.database-url]
env = "OPTO_SYNC_DATABASE_URL"
aliases = ["database-url"]
type = "string"
help = "Optional database URL for direct reads."
